<style>
    .case-card { border: 1px solid #007bff; margin-bottom: 20px; border-radius: 8px; background: #fff; overflow: hidden; }
    
    /* Fixed Alignment for Header */
    .case-header { 
        background: #007bff; color: white; padding: 12px 15px; 
        display: flex; align-items: center; cursor: pointer; gap: 15px;
    }
    .header-col-btn { flex: 0 0 80px; }
    .header-col-time { flex: 0 0 160px; font-family: 'Courier New', monospace; font-size: 0.9em; }
    .header-col-desc { flex: 1; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .toggle-btn {
        background: rgba(255,255,255,0.2); border: 1px solid white;
        color: white; border-radius: 4px; padding: 2px 8px; font-size: 0.8em; width: 100%;
    }

    /* Visible by default */
    .case-body { display: block; } 

    /* Hidden only when this class is present */
    .case-body.collapsed { display: none; }

    .tab-bar { display: flex; background: #f1f1f1; border-bottom: 1px solid #ddd; }
    .tab-btn { padding: 10px 20px; border: none; background: none; cursor: pointer; font-size: 0.85em; font-weight: bold; color: #555; }
    .tab-btn.active { background: #fff; color: #007bff; border-bottom: 2px solid #007bff; }
    
    .tab-content { display: none; padding: 15px; }
    .tab-content.active { display: block; }

    /* Fixed Alignment for Rows */
    .row-item { display: flex; font-size: 0.85em; padding: 6px 0; border-bottom: 1px dotted #eee; align-items: flex-start; }
    .time-col { 
        color: #666; 
        flex: 0 0 180px; /* Fixed width for timestamps */
        font-family: 'Courier New', monospace; 
        font-weight: bold; 
        border-right: 1px solid #eee;
        margin-right: 10px;
    }
    .text-col { flex: 1; padding-left: 5px; line-height: 1.4; } 
</style>

<body>
    <h2>RingerOPS Search Results for: {{ search }}</h2>

<div class="container">
    <div style="margin-bottom: 15px;">
        <button onclick="toggleAll(true)" class="btn">Expand All</button>
        <button onclick="toggleAll(false)" class="btn">Collapse All</button>
    </div>    

    {% for case in cases %}
        {% set case_idx = case.record_id %}

        <div class="case-card">
            <div class="case-header" onclick="toggleCase(event, '{{ case.record_id }}')">
                <div class="header-col-time">{{ case.create_datetime[:16] | replace('T', ' ') }}</div>
                <div class="header-col-desc">{{ case.ShortDescription }}</div>
                <div class="header-col-btn">
                    <button class="toggle-btn">Expand</button>
                </div>
            </div>

            <div id="body-{{ case.record_id }}" class="case-body collapsed" data-loaded="false">
                <div class="tab-container">
                    </div>
            </div>
        </div>

    {% endfor %}
</div>

<script>
// 1. Updated Toggle for a single case
// Change the function signature to accept the event
function toggleCase(event, caseId) {
    // 1. Get the actual header div that has the onclick listener
    const header = event.currentTarget; 
    
    // 2. Find the parent card and the body to expand
    const card = header.parentElement; // .case-card
    const body = document.getElementById(`body-${caseId}`);
    
    if (!body) {
        console.error("Could not find body for case:", caseId);
        return;
    }

    const btn = header.querySelector('.toggle-btn');
    const container = body.querySelector('.tab-container');

    // Toggle the 'collapsed' class
    const isExpanding = body.classList.contains('collapsed');
    
    if (isExpanding) {
        body.classList.remove('collapsed');
        if(btn) btn.innerText = "Collapse";
        
        // Lazy Load check
        if (body.getAttribute('data-loaded') !== 'true') {
            container.innerHTML = "<div style='padding:20px;'>Fetching details from Ringer...</div>";
            
            // Calling your dynamic detail route
            fetch(`/api/ringer/opsapi/detail/${caseId}.html`)
                .then(response => response.text())
                .then(html => {
                    container.innerHTML = html;
                    body.setAttribute('data-loaded', 'true');
                })
                .catch(err => {
                    container.innerHTML = "<div style='color:red; padding:20px;'>Error: Ringer unreachable.</div>";
                });
        }
    } else {
        body.classList.add('collapsed');
        if(btn) btn.innerText = "Expand";
    }
}

function switchSubTab(event, targetId) {
    // 1. Get the container for this specific case
    const wrapper = event.currentTarget.closest('.case-detail-wrapper');
    
    // 2. Deactivate all buttons and contents in THIS case only
    wrapper.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    wrapper.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    // 3. Activate the clicked button and target content
    event.currentTarget.classList.add('active');
    const target = wrapper.querySelector(`#${targetId}`);
    if (target) {
        target.classList.add('active');
    }
}

// 2. Updated Global toggle (Now syncs correctly with single toggle)
function toggleAll(expand) {
    document.querySelectorAll('.case-body').forEach(body => {
        const card = body.closest('.case-card');
        const btn = card.querySelector('.toggle-btn');
        
        // Remove inline styles to let the CSS class take over
        body.style.display = ""; 

        if (expand) {
            body.classList.remove('collapsed');
            btn.innerText = "Collapse";
        } else {
            body.classList.add('collapsed');
            btn.innerText = "Expand";
        }
    });
}

// Initialize Tabs (keeping logic from previous step)
document.addEventListener("DOMContentLoaded", function() {
    document.querySelectorAll('.case-card').forEach(card => {
        const firstBtn = card.querySelector('.tab-btn');
        if (firstBtn) activateTab(firstBtn);
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.stopPropagation(); // Prevent the card from collapsing when clicking a tab
            activateTab(this);
        });
});

function activateTab(btn) {
    const card = btn.closest('.case-card');
    const targetId = btn.getAttribute('data-target');
    card.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    card.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(targetId).classList.add('active');
}

function toggleAndFetch(caseId, header) {
            const body = document.getElementById(`body-${caseId}`);
            const btn = header.querySelector('.toggle-btn');
            const container = body.querySelector('.tab-container');

            // Toggle visibility
            const isExpanding = !body.classList.contains('expanded');
            body.classList.toggle('expanded');
            btn.innerText = isExpanding ? "Collapse" : "Expand";

            // If expanding and data not loaded, fetch it
            if (isExpanding && body.getAttribute('data-loaded') !== 'true') {
                fetch(`/api/ringer/opsapi?caseid=${caseId}`)
                    .then(response => response.text())
                    .then(html => {
                        container.innerHTML = html;
                        body.setAttribute('data-loaded', 'true');
                    })
                    .catch(err => {
                        container.innerHTML = `<div style="color:red; padding:10px;">Error: Could not reach Ringer.</div>`;
                    });
            }
        }

        function switchTab(btn, targetId) {
            const container = btn.closest('.tab-container');
            container.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            container.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            btn.classList.add('active');
            document.getElementById(targetId).classList.add('active');
        }    

});
</script>

</body>
